[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbench-dytswig-mamba-zh-addmask"
version = "0.1.0"
description = "DyTSwiG-Mamba speech enhancement Skill for OpenBench"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<2.4",
  "torchvision>=0.17,<0.19",
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "librosa>=0.10",
  "soundfile>=0.12",
  "PyYAML>=6.0",
  "einops>=0.8",
  "mamba-ssm==2.1.0",
  "causal-conv1d==1.4.0",
  "pesq>=0.0.4",
  "joblib>=1.3",
]

[tool.setuptools]
packages = []
